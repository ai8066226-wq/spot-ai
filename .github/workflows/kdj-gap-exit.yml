name: Evaluate KDJ Gap Exit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/ICNTUSDT_spot_15m.csv'
      - 'kdj_gap_exit.py'
      - '.github/workflows/kdj-gap-exit.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      RESEARCH_SOURCE: csv
      RESEARCH_SYMBOL: ICNTUSDT
      RESEARCH_INTERVAL: '15'
      RESEARCH_DATA_FILE: data/ICNTUSDT_spot_15m.csv
      RESEARCH_FEE: '0.001'
      RESEARCH_SLIPPAGE: '0.0005'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Verify implementation
        run: python -m unittest discover -s tests -v
      - name: Evaluate uploaded historical data
        run: python kdj_gap_exit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icnt-kdj-gap-${{ github.run_id }}
          path: |
            kdj_gap_outputs/
            data/ICNTUSDT_provenance.json
          retention-days: 14
          if-no-files-found: warn
