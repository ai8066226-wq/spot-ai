name: Run Bybit Research
on:
  workflow_dispatch:
    inputs:
      source:
        type: choice
        options: [demo, spot]
        default: demo
        description: 'Synthetic smoke data or real spot data'
      symbol:
        type: choice
        options: [ICNTUSDT, BTCUSDT, ETHUSDT, SOLUSDT]
        default: ICNTUSDT
        description: Spot symbol
      mode:
        type: choice
        options: [rules, ml, all]
        default: rules
        description: Research mode
      interval:
        type: choice
        options: ['15', '60', '240', D]
        default: '60'
        description: Candle interval
      days:
        type: string
        default: '180'
        description: History days (1..1460)
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      SOURCE: ${{ inputs.source }}
      SYMBOL: ${{ inputs.symbol }}
      MODE: ${{ inputs.mode }}
      INTERVAL: ${{ inputs.interval }}
      DAYS: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Research only
        shell: bash
        run: |
          if ! [[ "$DAYS" =~ ^[0-9]+$ ]] || (( DAYS < 1 || DAYS > 1460 )); then exit 1; fi
          if [[ "$SOURCE" == demo ]]; then
            python main.py --demo --fast --mode "$MODE"
          else
            python main.py --symbol "$SYMBOL" --interval "$INTERVAL" --days "$DAYS" --fast --mode "$MODE"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bybit-research-${{ inputs.source }}-${{ github.run_id }}
          path: results/
          retention-days: 14
          if-no-files-found: warn
