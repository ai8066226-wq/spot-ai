name: Spot AI Research
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'synthetic = software test; bybit = actual market data'
        type: choice
        options:
          - synthetic
          - bybit
        default: synthetic
        required: true
      symbol:
        description: 'Spot symbol, e.g. BTCUSDT'
        type: string
        default: BTCUSDT
        required: true
      interval:
        description: 'Candle duration (minutes)'
        type: choice
        options: ['5', '15', '30', '60', '240']
        default: '15'
        required: true
      days:
        description: 'History days: 30 to 730'
        type: number
        default: 180
        required: true
      fee:
        description: 'Assumed fee per side: 0.001 = 0.1%'
        type: string
        default: '0.001'
        required: true
      slippage:
        description: 'Assumed slippage per side: 0.0005 = 0.05%'
        type: string
        default: '0.0005'
        required: true
permissions:
  contents: read
concurrency:
  group: spot-ai-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      RESEARCH_SOURCE: ${{ inputs.source }}
      RESEARCH_SYMBOL: ${{ inputs.symbol }}
      RESEARCH_INTERVAL: ${{ inputs.interval }}
      RESEARCH_DAYS: ${{ inputs.days }}
      RESEARCH_FEE: ${{ inputs.fee }}
      RESEARCH_SLIPPAGE: ${{ inputs.slippage }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install binary dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Verify calculations and timing
        run: python -m unittest discover -s tests -v
      - name: Fetch and train
        run: python run_research.py
      - name: Save reports, data and model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spot-ai-${{ inputs.source }}-${{ github.run_id }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
