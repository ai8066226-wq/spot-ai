name: KDJ Trailing Exit Lab
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Stored spot dataset'
        type: choice
        options: [ICNTUSDT, BTCUSDT]
        default: ICNTUSDT
      targets:
        description: 'Profit targets in percent, comma-separated'
        type: string
        default: '0.5,1,2,3,5'
      initial_stops:
        description: 'Initial stops in percent'
        type: string
        default: '0.5,1,2'
      trailing_percent:
        description: 'Trailing distances in percent'
        type: string
        default: '0.3,0.5,1,2'
      trailing_atr:
        description: 'Trailing distances in ATR multiples'
        type: string
        default: '1,1.5,2'
      activations:
        description: 'Start trailing after this profit percent; 0 = immediately'
        type: string
        default: '0,0.5,1'
  push:
    branches: [main]
    paths:
      - 'trailing_lab.py'
      - '.github/workflows/trailing-lab.yml'
      - 'data/ICNTUSDT_spot_15m.csv'
      - 'data/candles.csv'
permissions:
  contents: read
concurrency:
  group: trailing-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  laboratory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      LAB_SYMBOL: ${{ inputs.symbol || 'ICNTUSDT' }}
      LAB_TARGETS: ${{ inputs.targets || '0.5,1,2,3,5' }}
      LAB_INITIAL_STOPS: ${{ inputs.initial_stops || '0.5,1,2' }}
      LAB_TRAILING_PERCENT: ${{ inputs.trailing_percent || '0.3,0.5,1,2' }}
      LAB_TRAILING_ATR: ${{ inputs.trailing_atr || '1,1.5,2' }}
      LAB_ACTIVATIONS: ${{ inputs.activations || '0,0.5,1' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Verify execution and causality
        run: python -m unittest discover -s tests -v
      - name: Compare exit settings
        run: |
          python trailing_lab.py --symbol "$LAB_SYMBOL" --targets "$LAB_TARGETS" --initial-stops "$LAB_INITIAL_STOPS" --trailing-percent "$LAB_TRAILING_PERCENT" --trailing-atr "$LAB_TRAILING_ATR" --activations "$LAB_ACTIVATIONS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kdj-trailing-lab-${{ github.run_id }}
          path: trailing_lab_outputs/
          retention-days: 14
          if-no-files-found: warn
